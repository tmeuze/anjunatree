name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets the weekly catalogue refresh redeploy without duplicating these steps.
  workflow_call:

# GITHUB_TOKEN permissions for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # A repository *variable*, not a secret — the Client ID is public by
          # design and ends up in the bundle either way.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          # Stored as a secret so it isn't in git, though it is also served to
          # every visitor once deployed. The .p8 it derives from never leaves
          # your machine and must never be added here.
          VITE_APPLE_DEV_TOKEN: ${{ secrets.VITE_APPLE_DEV_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Scoping to an environment lets you require review before a deploy can
    # read these values — see the security notes in docs/DEVELOPMENT.md.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
